<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcreFoot | Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5f4ef; --panel: #fffdf8; --ink: #1e2a24; --ink-soft: #52605a;
    --river: #2b6777; --river-deep: #1c4552; --clay: #a8643f; --moss: #3f6b4a;
    --line: #ddd6c4; --amber: #b8863a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter', sans-serif;line-height:1.5;}
  .wrap{max-width:640px;margin:0 auto;padding:40px 24px 80px;}
  header{margin-bottom:32px;}
  .brand-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .brand-logo{font-family:'Fraunces', serif;font-weight:700;font-size:20px;color:var(--river-deep);text-decoration:none;letter-spacing:-0.01em;}
  .brand-logo:hover{color:var(--river);}
  .state-nav{font-family:'JetBrains Mono', monospace; font-size:12px;}
  .state-nav a{color:var(--ink-soft); text-decoration:none; padding:4px 8px; border-radius:5px;}
  .state-nav a.current{color:var(--river); font-weight:600; background:#eaf1f2;}
  .state-nav a:hover{text-decoration:underline;}
  .eyebrow{font-family:'JetBrains Mono', monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--river);margin-bottom:10px;}
  h1{font-family:'Fraunces', serif;font-weight:700;font-size:clamp(28px,4vw,42px);margin:0 0 12px;color:var(--river-deep);letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft);font-size:16px;max-width:62ch;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:24px;}
  form{display:flex;flex-wrap:wrap;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;flex-basis:100%;}
  label{font-size:13px;font-weight:500;color:var(--ink-soft);}
  input, textarea{padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:120px;}
  input:focus, textarea:focus{outline:2px solid var(--river);outline-offset:1px;}
  button{padding:11px 20px;background:var(--river);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  button:hover{background:var(--river-deep);}
  button:disabled{background:#a9b3af;cursor:wait;}
  .status{font-size:14px;color:var(--ink-soft);margin-top:14px;min-height:20px;}
  .status.error{color:var(--clay);font-weight:500;}
  .status.success{color:var(--moss);font-weight:500;}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);}
  footer a{color:var(--river);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand-bar">
      <a href="/" class="brand-logo">AcreFoot</a>
      <nav class="state-nav"><a href="/">Colorado</a> · <a href="/idaho.html">Idaho</a> · <a href="/utah.html">Utah</a> · <a href="/montana.html">Montana</a> · <a href="/nevada.html">Nevada</a> · <a href="/marketplace.html">Marketplace</a></nav>
    </div>
    <div class="eyebrow">Get in touch</div>
    <h1>Contact</h1>
    <p class="sub">Questions, feedback, or something not working right? Send a message below.</p>
  </header>

  <div class="panel">
    <form id="contactForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" required></textarea>
      </div>
      <button type="submit" id="submitBtn">Send message</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <footer>
    <p>This goes directly to the team behind AcreFoot — not a bot, not a ticket queue.</p>
  </footer>

</div>

<script>
const form = document.getElementById('contactForm');
const statusEl = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');

function serverErrorMessage(err){
  if(err instanceof TypeError && /fetch/i.test(err.message)){
    return "Could not reach the server. Make sure you're loading this page from the live site.";
  }
  return `Something went wrong: ${err.message}`;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending…';
  statusEl.className = 'status';
  statusEl.textContent = '';

  try {
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        message: document.getElementById('message').value.trim(),
      }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || `Server responded with status ${res.status}`);

    statusEl.className = 'status success';
    statusEl.textContent = "Sent. We'll get back to you soon.";
    form.reset();
  } catch(err){
    statusEl.className = 'status error';
    statusEl.textContent = serverErrorMessage(err);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send message';
  }
});
</script>

</body>
</html>
